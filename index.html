<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Timepass Tea</title>
  
  <meta name="description" content="Distraction-free, accessible story reader designed for comfortable reading." />
  <meta name="theme-color" content="#F4EFE6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <link rel="stylesheet" href="./src/assets/styles/main.css" />
  <link rel="stylesheet" href="./src/assets/styles/reader.css" />
</head>
<body>
  <div id="app">
    <!-- View 1: Library View -->
    <main id="view-library" class="view active">
      <div class="library-container">
        <header class="library-header">
          <div class="brand-badge">
            <img src="icons/icon-192x192.png" alt="Timepass Tea Logo" class="brand-icon" width="38" height="38" />
            <h1 class="library-title">Timepass Tea</h1>
          </div>
          <div class="library-actions">
            <button id="btn-toggle-theme" aria-label="Toggle Theme">
              <i id="icon-theme" data-lucide="moon"></i>
            </button>
          </div>
        </header>

        <!-- Continue Reading Card Section -->
        <section id="continue-section"></section>

        <!-- Story Catalog Grid -->
        <section id="story-list" class="story-list"></section>
      </div>
    </main>

    <!-- View 2: Reader View -->
    <section id="view-reader" class="reader-view">
      <!-- Reader Viewport & Track for Single-Page Carousel -->
      <div id="reader-viewport" class="reader-viewport" aria-label="Story reader viewport">
        <div id="reader-track" class="reader-track"></div>
        <!-- Off-screen measurer for zero-line-cut dynamic pagination -->
        <div id="reader-measurer" class="reader-measurer" aria-hidden="true"></div>
      </div>

      <!-- Boundary Notification Toast -->
      <div id="reader-toast" class="reader-toast" role="status" aria-live="polite"></div>

      <!-- Distraction-Free HUD Overlay (Auto-hidden) -->
      <div id="hud-container">
        <!-- Top HUD Header (Compact: Back, Title, Fullscreen, Chapters, Theme) -->
        <header class="hud-top">
          <div class="hud-header-content">
            <button id="btn-back-to-library" class="btn-back-library" aria-label="Back to Library">
              <i data-lucide="arrow-left"></i>
              <span>Library</span>
            </button>
            <div id="story-header-title" class="story-header-title">Story Title</div>
            <div class="hud-controls-group">
              <button id="btn-fullscreen" class="hud-btn-icon" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
                <i id="icon-fullscreen" data-lucide="maximize"></i>
              </button>
              <button id="btn-open-toc" class="hud-btn-icon" aria-label="Table of Contents" title="Chapters">
                <i data-lucide="list"></i>
              </button>
              <button id="btn-reader-theme" class="hud-btn-icon" aria-label="Toggle Theme" title="Toggle Theme">
                <i data-lucide="sun-medium"></i>
              </button>
            </div>
          </div>
        </header>

        <!-- Bottom HUD Controls & Progress Bar (Ergonomic thumb-accessible font scaling) -->
        <footer class="hud-bottom">
          <div class="hud-bottom-content">
            <div class="hud-bottom-row">
              <div class="hud-font-controls" aria-label="Font Size Controls">
                <button id="btn-font-minus" class="btn-font-scale" aria-label="Decrease Font" title="Smaller Text">A−</button>
                <button id="btn-font-plus" class="btn-font-scale" aria-label="Increase Font" title="Larger Text">A+</button>
              </div>
              <div class="progress-info">
                <span id="page-progress-text">Page 1 of 1</span>
              </div>
            </div>
            <input type="range" id="progress-slider" class="progress-slider" min="0" max="0" value="0" />
          </div>
        </footer>
      </div>

      <!-- Chapter Menu Drawer (ToC) -->
      <div id="toc-drawer" class="toc-drawer">
        <aside class="toc-panel">
          <div class="toc-header">
            <h3>Chapters</h3>
            <button id="btn-close-toc" aria-label="Close Chapters">
              <i data-lucide="x"></i>
            </button>
          </div>
          <ul id="toc-list" class="toc-list"></ul>
        </aside>
      </div>
    </section>

    <!-- Passphrase Decryption Modal -->
    <div id="passphrase-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h2>Enter Passphrase</h2>
        <p>This library is encrypted for private reading. Please enter your passphrase to unlock.</p>
        <input type="password" id="passphrase-input" placeholder="Passphrase..." autocomplete="current-password" />
        <button id="btn-submit-passphrase" class="btn" style="width:100%;">Unlock Stories</button>
        <p id="passphrase-error" class="error-text"></p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
